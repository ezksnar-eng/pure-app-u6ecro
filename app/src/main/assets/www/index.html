<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c9481">
  <meta name="description" content="وَصل — مراسلة خاصة للرسائل والصور بين الأصدقاء">
  <title>وَصل — مراسلة الصور الخاصة</title>
  <style>
    :root{font-family:Tahoma,Arial,sans-serif;color:#17272b;background:#eaf1f3}*[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#eaf1f3}button,input{font:inherit}button{border:0;cursor:pointer}.app{height:100dvh;display:flex;direction:rtl;background:#eef4f5}.sidebar{width:350px;background:#fbfdfd;border-left:1px solid #dce8e8;display:flex;flex-direction:column;z-index:20}.brand-row{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #edf2f2}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:39px;height:39px;display:grid;place-items:center;border-radius:13px 13px 13px 4px;background:#0c9481;color:#fff;box-shadow:0 8px 18px #0c94812b;font-size:21px;transform:rotate(-4deg)}.brand-title{font-size:20px;line-height:1;font-weight:800}.brand-subtitle{font-size:10px;color:#819294;margin-top:5px;font-weight:600}.head-actions{display:flex;gap:5px}.icon{width:36px;height:36px;border-radius:11px;background:transparent;color:#708488;display:grid;place-items:center;transition:.2s}.icon:hover{background:#edf7f5;color:#087c6d}.profile-area{padding:19px 22px 13px}.profile{display:flex;align-items:center;gap:10px}.my-avatar{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#f3b67d,#d8755f);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;position:relative}.my-avatar:after{content:'';position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;background:#21b77a;border:2px solid #fff;border-radius:50%}.profile-name{font-size:13px;font-weight:700}.profile-status{font-size:10px;color:#859496;margin-top:2px}.profile .icon{margin-right:auto}.search{position:relative;margin:2px 22px 15px}.search input{width:100%;height:42px;background:#f0f5f5;border:1px solid transparent;border-radius:12px;outline:0;color:#1c3032;padding:0 42px 0 13px;font-size:12px}.search input:focus{border-color:#acd8d1;background:#fff;box-shadow:0 0 0 3px #0c948113}.search span{position:absolute;right:13px;top:11px;color:#8b9b9c;font-size:17px}.tabs{display:flex;padding:0 22px;gap:19px;border-bottom:1px solid #edf2f2}.tab{background:none;color:#879798;font-size:11px;font-weight:700;padding:0 0 12px;position:relative}.tab.active{color:#0a8979}.tab.active:after{content:'';position:absolute;bottom:-1px;right:0;left:0;height:2px;border-radius:5px;background:#0c9481}.chat-list{overflow:auto;padding:8px 10px 18px;flex:1;overscroll-behavior:contain}.chat-item{display:flex;align-items:center;width:100%;text-align:right;padding:11px 12px;gap:11px;border-radius:13px;background:transparent;transition:.2s}.chat-item:hover{background:#f1f7f7}.chat-item.active{background:#e6f5f1}.avatar{width:47px;height:47px;flex:0 0 auto;border-radius:15px;position:relative;overflow:visible;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px}.avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}.dot{width:10px;height:10px;background:#22b978;border:2px solid #fff;border-radius:50%;position:absolute;bottom:-1px;left:-2px}.chat-copy{min-width:0;flex:1}.chat-line{display:flex;justify-content:space-between;gap:7px;align-items:center}.chat-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-time{font-size:9px;color:#9aacad;white-space:nowrap}.chat-preview{margin-top:4px;font-size:10px;color:#819294;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unread{min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;background:#0c9481;color:#fff;border-radius:9px;font-size:9px;font-weight:800}.sidebar-foot{padding:13px 22px 19px;border-top:1px solid #edf2f2;display:flex;align-items:center;justify-content:space-between;color:#8b9b9c;font-size:10px}.secure{color:#7d9a96}.main{flex:1;min-width:0;display:flex;flex-direction:column;background:#dfecee;position:relative}.chat-head{height:74px;flex:0 0 auto;background:#fbfdfd;border-bottom:1px solid #d8e6e6;display:flex;align-items:center;padding:0 24px;gap:12px}.mobile-menu{display:none}.person{display:flex;align-items:center;gap:11px}.person-copy{min-width:0}.person-name{font-size:13px;font-weight:800}.person-status{display:flex;align-items:center;gap:5px;font-size:10px;color:#1a9a76;margin-top:3px}.person-status i{width:5px;height:5px;background:#20b67b;border-radius:50%}.head-actions{margin-right:auto}.head-actions .divider{width:1px;height:24px;background:#dce7e7;margin:7px}.content{flex:1;min-height:0;display:flex}.messages{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}.messages:before{content:'';position:absolute;inset:0;opacity:.34;pointer-events:none;background-image:radial-gradient(#8ba7a7 .7px,transparent .7px);background-size:19px 19px}.notice{align-self:center;position:relative;z-index:1;margin:16px 18px 5px;padding:7px 12px;border-radius:9px;background:#fff7db;color:#8b6c2e;font-size:9px;box-shadow:0 2px 8px #a8872410}.scroll{flex:1;overflow:auto;padding:11px 7.5% 18px;position:relative;z-index:1;overscroll-behavior:contain}.date{width:max-content;margin:3px auto 18px;padding:5px 11px;border-radius:8px;background:#d2e3e4;color:#6e8587;font-size:9px;font-weight:700}.row{display:flex;margin:7px 0;content-visibility:auto;contain-intrinsic-size:70px}.row.out{justify-content:flex-start}.row.in{justify-content:flex-end}.bubble{max-width:min(520px,74%);border-radius:14px;padding:9px 12px 6px;position:relative;font-size:12px;line-height:1.75;box-shadow:0 2px 4px #566d6d10}.out .bubble{background:#d5f3e9;border-top-right-radius:4px}.in .bubble{background:#fff;border-top-left-radius:4px}.time{float:left;direction:ltr;display:flex;align-items:center;gap:3px;color:#809697;font-size:8px;margin:9px 0 0 10px;line-height:1}.out .time{color:#159b87}.photo{padding:4px 4px 6px;min-width:194px}.photo img{display:block;width:min(290px,100%);max-height:260px;object-fit:cover;border-radius:10px;cursor:zoom-in}.photo .time{margin-left:7px;margin-right:5px}.composer-wrap{position:relative;z-index:3;padding:12px 6.7% 20px;background:linear-gradient(to top,#dfecee 74%,transparent)}.composer{min-height:52px;border:1px solid #d4e3e3;background:#fff;border-radius:16px;box-shadow:0 7px 20px #42676812;display:flex;align-items:center;gap:6px;padding:6px 8px}.composer input{flex:1;border:0;outline:0;min-width:0;color:#1d3636;font-size:12px;padding:0 7px}.composer input::placeholder{color:#9eaeae}.send{width:37px;height:37px;display:grid;place-items:center;background:#0c9481;color:#fff;border-radius:12px;cursor:pointer;font-size:17px}.emoji-panel{position:absolute;bottom:74px;right:7%;z-index:10;padding:10px;background:#fff;box-shadow:0 8px 30px #173d3d22;border:1px solid #e0eaea;border-radius:13px;width:194px;display:flex;flex-wrap:wrap;gap:4px}.emoji-panel button{background:#f4f8f8;border-radius:8px;width:29px;height:29px;font-size:17px}.details{width:270px;background:#fbfdfd;border-right:1px solid #d8e6e6;padding:26px 18px;overflow:auto}.details h3{font-size:12px;margin:0 0 25px}.detail-profile{text-align:center;padding-bottom:23px;border-bottom:1px solid #e7eeee}.detail-profile .avatar{margin:0 auto 10px;width:58px;height:58px;border-radius:18px}.detail-profile strong{font-size:13px}.detail-profile p{margin:4px 0;color:#799092;font-size:10px}.group{padding:19px 3px;border-bottom:1px solid #e7eeee}.label{font-size:10px;color:#8b9c9d;margin-bottom:12px}.line{display:flex;align-items:center;gap:9px;font-size:11px;margin:11px 0;color:#395253}.line button{margin-right:auto;background:none;color:#849697}.media{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.media img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:50;background:#173b3a;color:#fff;border-radius:10px;padding:10px 15px;font-size:11px;box-shadow:0 8px 24px #173b3a30}.modal,.lightbox{position:fixed;inset:0;background:#142d2dcc;display:grid;place-items:center;z-index:100;padding:20px}.card{width:min(430px,100%);background:#fff;border-radius:18px;padding:14px;box-shadow:0 20px 60px #102e2e55}.card-head{display:flex;align-items:center;justify-content:space-between;padding:3px 4px 13px;font-size:12px;font-weight:800}.card img{width:100%;max-height:420px;object-fit:cover;border-radius:12px}.card-foot{display:flex;align-items:center;gap:8px;padding-top:13px}.file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#758889;font-size:10px}.send-photo{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;color:#fff;background:#0c9481;border-radius:10px;font-size:11px;font-weight:700}.lightbox img{max-width:96vw;max-height:86vh;border-radius:13px;object-fit:contain}.close{position:fixed;top:18px;left:20px;color:#fff;background:#ffffff22}.backdrop{display:none}
    @media(max-width:1040px){.sidebar{width:310px}.details{width:230px}.scroll{padding-left:4%;padding-right:4%}.composer-wrap{padding-left:4%;padding-right:4%}}@media(max-width:760px){.sidebar{position:absolute;top:0;right:0;bottom:0;width:min(340px,88vw);transform:translateX(105%);transition:transform .25s;box-shadow:-10px 0 30px #153e3e1a}.sidebar.open{transform:translateX(0)}.backdrop.show{display:block;position:fixed;inset:0;background:#163c3c55;z-index:15}.main{width:100%}.chat-head{height:67px;padding:0 12px}.mobile-menu{display:grid}.head-actions .divider,.head-actions .search-btn{display:none}.scroll{padding:10px 11px 18px}.bubble{max-width:83%;font-size:11px}.composer-wrap{padding:8px 10px 14px}.details{position:absolute;inset:0;width:100%;z-index:12}.photo img{max-height:220px}}
  </style>
</head>
<body>
  <div id="app" class="app">
    <div id="backdrop" class="backdrop"></div>
    <aside id="sidebar" class="sidebar">
      <div class="brand-row"><div class="brand"><div class="brand-mark">◔</div><div><div class="brand-title">وَصل</div><div class="brand-subtitle">مراسلة خاصة، بدون زحمة</div></div></div><div class="head-actions"><button class="icon" id="newChat" title="محادثة جديدة">＋</button><button class="icon" id="more" title="المزيد">⋮</button></div></div>
      <div class="profile-area"><div class="profile"><div class="my-avatar">أح</div><div><div class="profile-name">أحمد حسن</div><div class="profile-status">حسابك الشخصي</div></div><button class="icon">⌄</button></div></div>
      <div class="search"><span>⌕</span><input id="search" placeholder="ابحث في محادثاتك"></div>
      <div class="tabs"><button class="tab active" data-section="chats">المحادثات</button><button class="tab" data-section="status">الحالات</button><button class="tab" data-section="calls">المكالمات</button></div>
      <div id="chatList" class="chat-list"></div>
      <div class="sidebar-foot"><span class="secure">⌾ محادثاتك محمية</span><span>v1.0</span></div>
    </aside>
    <main class="main">
      <header class="chat-head"><button id="menu" class="icon mobile-menu">☰</button><div id="person" class="person"></div><div class="head-actions"><button class="icon search-btn" id="chatSearch">⌕</button><span class="divider"></span><button class="icon" id="call">♧</button><button class="icon" id="video">▣</button><button class="icon" id="detailsBtn">ⓘ</button></div></header>
      <div class="content"><section class="messages"><div class="notice">⌾ الرسائل والصور بينك وبين فراس العزاوي فقط</div><div id="messages" class="scroll"></div><div class="composer-wrap"><div id="emojiPanel" class="emoji-panel" hidden></div><form id="composer" class="composer"><button type="button" class="icon" id="attach">⌕</button><button type="button" class="icon" id="imageBtn">▧</button><input id="draft" placeholder="اكتب رسالة..." autocomplete="off"><button type="button" class="icon" id="emoji">☺</button><button class="send" id="send" type="submit">➤</button></form><input id="file" type="file" accept="image/*" hidden></div></section><aside id="details" class="details" hidden></aside></div>
    </main>
  </div>
  <div id="toast" class="toast" hidden></div>
  <div id="preview" class="modal" hidden><div class="card"><div class="card-head"><span>معاينة الصورة قبل الإرسال</span><button class="icon" id="closePreview">×</button></div><img id="previewImg" alt="معاينة"><div class="card-foot"><span id="fileName" class="file-name"></span><button id="sendPhoto" class="send-photo">➤ إرسال الصورة</button></div></div></div>
  <div id="lightbox" class="lightbox" hidden><button id="closeLightbox" class="icon close">×</button><img id="lightboxImg" alt="صورة مكبرة"></div>
  <script>
    const chats=[{id:'feras',name:'فراس العزاوي',initials:'ف ع',color:'#0f766e',avatar:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=96&q=68',status:'متصل الآن',online:true,last:'وصلت الصور، كلش حلوة!',time:'١٠:٤٢ م',unread:2},{id:'zahraa',name:'زهراء محمد',initials:'ز م',color:'#9d174d',avatar:'https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=96&q=68',status:'آخر ظهور اليوم ٨:١٦ م',last:'خل نرتبها لباجر',time:'٨:١٦ م',unread:0},{id:'family',name:'عائلتي',initials:'ع',color:'#c2410c',status:'٤ أعضاء',last:'أبوية: لا تنسون العشاء',time:'٧:٥٨ م',unread:5},{id:'work',name:'فريق العمل',initials:'ف ع',color:'#4338ca',status:'٦ أعضاء',last:'تم تحديث الملف المشترك',time:'٦:٣٠ م',unread:0}];
    const starter=[['in','text','هلا حبيبي، شلونك؟','١٠:٣٥ م'],['out','text','هلا والله، تمام الحمدلله. إنت شخبارك؟','١٠:٣٦ م'],['in','text','بخير، شوف هالصور من طلعتنا اليوم','١٠:٣٨ م'],['in','img','https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=640&q=70','١٠:٣٩ م'],['out','text','واو! المكان يجنن، أرسل البقية همين','١٠:٤٠ م'],['out','img','https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=640&q=70','١٠:٤١ م'],['in','text','وصلت الصور، كلش حلوة!','١٠:٤٢ م']].map((x,i)=>({id:'m'+i,dir:x[0],kind:x[1],value:x[2],time:x[3],status:'read'}));
    let messages=JSON.parse(localStorage.getItem('wasl-html-messages')||'null')||starter, active='feras', selectedFile=null;
    const $=id=>document.getElementById(id), now=()=>new Date().toLocaleTimeString('ar-IQ',{hour:'numeric',minute:'2-digit'});
    function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').hidden=true,2400)}
    function avatar(c,large=false){return `<div class="avatar" style="background:${c.color};${large?'width:58px;height:58px;border-radius:18px':''}">${c.avatar?`<img loading="lazy" decoding="async" src="${c.avatar}" alt="">`:`<span>${c.initials}</span>`}${c.online?'<i class="dot"></i>':''}</div>`}
    function renderChats(filter=''){$('chatList').innerHTML=chats.filter(c=>c.name.includes(filter)||c.last.includes(filter)).map(c=>`<button class="chat-item ${c.id===active?'active':''}" data-id="${c.id}">${avatar(c)}<div class="chat-copy"><div class="chat-line"><span class="chat-name">${c.name}</span><span class="chat-time">${c.time}</span></div><div class="chat-line"><span class="chat-preview">${c.last}</span>${c.unread?`<span class="unread">${c.unread}</span>`:''}</div></div></button>`).join('')||'<div style="padding:35px;text-align:center;color:#819596;font-size:11px">ما لقينا نتائج</div>';document.querySelectorAll('.chat-item').forEach(b=>b.onclick=()=>{active=b.dataset.id;render();$('sidebar').classList.remove('open');$('backdrop').classList.remove('show')})}
    function render(){const c=chats.find(x=>x.id===active)||chats[0];$('person').innerHTML=avatar(c)+`<div class="person-copy"><div class="person-name">${c.name}</div><div class="person-status"><i></i>${c.status}</div></div>`;$('messages').innerHTML='<div class="date">اليوم</div>'+messages.map(m=>`<div class="row ${m.dir}"><div class="bubble ${m.kind==='img'?'photo':''}">${m.kind==='img'?`<img loading="lazy" decoding="async" src="${m.value}" alt="صورة مرسلة" onclick="openImage('${m.value}')">`:`<span>${m.value}</span>`}<span class="time">${m.time}${m.dir==='out'?' ✓✓':''}</span></div></div>`).join('');$('messages').scrollTop=$('messages').scrollHeight;renderChats($('search').value.trim())}
    function openImage(url){$('lightboxImg').src=url;$('lightbox').hidden=false}window.openImage=openImage;
    $('composer').onsubmit=e=>{e.preventDefault();const input=$('draft'),text=input.value.trim();if(!text)return;messages.push({id:'m'+Date.now(),dir:'out',kind:'text',value:text,time:now(),status:'read'});localStorage.setItem('wasl-html-messages',JSON.stringify(messages));input.value='';render()};
    $('search').oninput=e=>renderChats(e.target.value.trim());$('menu').onclick=()=>{$('sidebar').classList.add('open');$('backdrop').classList.add('show')};$('backdrop').onclick=()=>{$('sidebar').classList.remove('open');$('backdrop').classList.remove('show')};
    $('imageBtn').onclick=$('attach').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>12*1024*1024){toast('حجم الصورة لازم أقل من 12 ميجابايت');return}selectedFile={url:URL.createObjectURL(f),name:f.name};$('previewImg').src=selectedFile.url;$('fileName').textContent=f.name;$('preview').hidden=false;e.target.value=''};$('closePreview').onclick=()=>$('preview').hidden=true;
    $('sendPhoto').onclick=()=>{if(!selectedFile)return;messages.push({id:'i'+Date.now(),dir:'out',kind:'img',value:selectedFile.url,time:now(),status:'read'});localStorage.setItem('wasl-html-messages',JSON.stringify(messages));selectedFile=null;$('preview').hidden=true;render()};
    const emojis=['😊','😂','❤️','👍','🔥','👏','😍','✨','🙏','😎','🎉','🤍'];$('emojiPanel').innerHTML=emojis.map(e=>`<button type="button">${e}</button>`).join('');$('emoji').onclick=()=>{$('emojiPanel').hidden=!$('emojiPanel').hidden};document.querySelectorAll('#emojiPanel button').forEach(b=>b.onclick=()=>{$('draft').value+=b.textContent});
    $('closeLightbox').onclick=()=>$('lightbox').hidden=true;$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('lightbox').hidden=true};$('newChat').onclick=()=>toast('أضف صديقاً عبر اسم المستخدم أو رمز الدعوة');$('call').onclick=$('video').onclick=()=>toast('المكالمات جاهزة للربط بالحسابات');$('chatSearch').onclick=()=>{$('search').focus();toast('اكتب كلمة البحث في خانة المحادثات')};
    $('detailsBtn').onclick=()=>{const d=$('details'),c=chats.find(x=>x.id===active);d.hidden=!d.hidden;if(!d.hidden)d.innerHTML=`<h3>تفاصيل المحادثة</h3><div class="detail-profile">${avatar(c,true)}<strong>${c.name}</strong><p>${c.status}</p></div><div class="group"><div class="label">إجراءات</div><div class="line">🔔 كتم الإشعارات</div><div class="line">📌 تثبيت المحادثة</div><div class="line">⭐ الرسائل المميزة</div></div><div class="group"><div class="label">الوسائط والروابط</div><div class="media">${messages.filter(m=>m.kind==='img').map(m=>`<img src="${m.value}" loading="lazy" onclick="openImage('${m.value}')">`).join('')}</div></div><div class="group"><div class="label">الخصوصية</div><div class="line">⌾ التشفير التام بين الطرفين</div></div>`};
    document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');if(t.dataset.section!=='chats')toast(t.dataset.section==='status'?'الحالات جاهزة للإضافة':'ماكو مكالمات بعد')});render();
  </script>
</body>
</html>
