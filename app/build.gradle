plugins {
    id 'com.android.application'
}

def withLlm = (project.findProperty('withLlm') ?: 'true').toString() == 'true'
if (withLlm) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jeron.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.jeron.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDir(withLlm ? 'src/llm/java' : 'src/nollm/java')
        }
    }
}

if (withLlm) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
            freeCompilerArgs.add('-Xskip-metadata-version-check')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'com.google.android.gms:play-services-nearby:19.1.0'
    if (withLlm) {
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
        // نموذج امبد المحلي (Gemma 4) عبر LiteRT-LM الرسمي من Google
        implementation 'com.google.ai.edge.litertlm:litertlm-android:latest.release'
    }
}
